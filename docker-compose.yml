services:
  api:
    build:
      context: ./apps/api
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-homedash}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-homedash}
      CORS_ORIGIN: ${CORS_ORIGIN:?Set CORS_ORIGIN}
      SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-30}
      BOOTSTRAP_USERNAME: ${BOOTSTRAP_USERNAME:-}
      BOOTSTRAP_PASSWORD: ${BOOTSTRAP_PASSWORD:-}
      NOTIFICATION_CENTER_URL: ${NOTIFICATION_CENTER_URL:-}
      NOTIFICATION_CENTER_READ_TOKEN: ${NOTIFICATION_CENTER_READ_TOKEN:-}
      NOTIFICATION_CENTER_TIMEOUT_MS: ${NOTIFICATION_CENTER_TIMEOUT_MS:-5000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 6
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - homedash-internal
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 6
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${FRONTEND_BIND_ADDRESS:-127.0.0.1}:${FRONTEND_PORT:-8080}:8080"
    networks:
      - homedash-internal
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-homedash}
      POSTGRES_USER: ${POSTGRES_USER:-homedash}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - homedash-postgres-data:/var/lib/postgresql/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - homedash-internal

volumes:
  homedash-postgres-data:

networks:
  homedash-internal:
    driver: bridge
